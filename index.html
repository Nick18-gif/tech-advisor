<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="description" content="Tech Advisor - Valuta se conviene aggiornare, riparare o sostituire il tuo dispositivo elettronico.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Advisor</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    body { 
      /* Sfondo dinamico e colorato per esaltare l'effetto vetro */
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4338ca 100%);
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
      position: relative;
      overflow-x: hidden;
    }

    /* Elementi decorativi per lo sfondo illuminato sotto il vetro */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }
    body::before {
      width: 300px;
      height: 300px;
      background: rgba(59, 130, 246, 0.4);
      top: 10%;
      left: 15%;
    }
    body::after {
      width: 350px;
      height: 350px;
      background: rgba(168, 85, 247, 0.35);
      bottom: 10%;
      right: 15%;
    }

    /* Effetto Liquid Glass per il contenitore principale */
    .container { 
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.12); 
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 30px; 
      border-radius: 24px; 
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.3); 
      max-width: 550px; 
      width: 100%; 
    }

    h1 { 
      font-size: 1.8rem; 
      margin-bottom: 8px; 
      color: #ffffff; 
      text-align: center; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    
    p.subtitle { 
      font-size: 0.95rem; 
      color: rgba(255, 255, 255, 0.8); 
      text-align: center; 
      margin-bottom: 24px; 
    }

    .form-group { margin-bottom: 16px; }
    
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 6px; 
      font-size: 0.9rem; 
      color: #e2e8f0;
    }

    select, input { 
      width: 100%; 
      padding: 12px; 
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 12px; 
      font-size: 1rem; 
      color: #ffffff;
      outline: none; 
      transition: all 0.3s ease; 
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    select option {
      background-color: #1e1b4b;
      color: #ffffff;
    }

    select:focus, input:focus { 
      border-color: #60a5fa; 
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
    }

    button { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white; 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      border-radius: 12px; 
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 10px; 
      transition: all 0.3s ease; 
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    button:hover { 
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
      transform: translateY(-1px);
    }

    .result-card { 
      margin-top: 24px; 
      padding: 20px; 
      border-radius: 16px; 
      display: none; 
      animation: fadeIn 0.3s ease-in-out; 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .status-badge { 
      display: inline-block; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-weight: bold; 
      font-size: 0.85rem; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }

    .status-keep { background-color: rgba(34, 197, 94, 0.25); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.4); }
    .status-upgrade { background-color: rgba(234, 179, 8, 0.25); color: #fde047; border: 1px solid rgba(253, 224, 71, 0.4); }
    .status-replace { background-color: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.4); }

    .result-card h3 { margin-bottom: 10px; font-size: 1.2rem; color: #ffffff; }
    .result-card p { font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; margin-bottom: 12px; }

    .recommendations { 
      margin-top: 12px; 
      background: rgba(0, 0, 0, 0.2); 
      padding: 12px; 
      border-radius: 12px; 
      border-left: 4px solid #60a5fa; 
    }

    .recommendations h4 { font-size: 0.95rem; margin-bottom: 6px; color: #ffffff; }
    .recommendations ul { list-style: none; }
    .recommendations li { font-size: 0.9rem; padding: 4px 0; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tech advisor</h1>
    <p class="subtitle">Scopri se è ora di cambiare il tuo dispositivo e cosa comprare con il tuo budget.</p>

    <form id="techForm">
      <div class="form-group">
        <label for="category">Tipo di Dispositivo</label>
        <select id="category" required>
          <option value="" disabled selected>Seleziona una categoria</option>
          <option value="smartphone">Smartphone</option>
          <option value="tablet">Tablet</option>
          <option value="speaker">Cassa Bluetooth / Audio</option>
          <option value="smartwatch">Smartwatch</option>
        </select>
      </div>

      <div class="form-group">
        <label for="model">Modello esatto</label>
        <input type="text" id="model" placeholder="Es. Huawei P30 Lite, Redmi Pad SE, JBL GO 3..." required>
      </div>

      <div class="form-group">
        <label for="year">Anno di acquisto (approssimativo)</label>
        <input type="number" id="year" placeholder="Es. 2019" min="2000" max="2026" required>
      </div>

      <div class="form-group">
        <label for="budget">Il tuo Budget (€)</label>
        <input type="number" id="budget" placeholder="Es. 250" min="10" required>
      </div>

      <button type="submit">Valuta Dispositivo</button>
    </form>

    <div id="resultCard" class="result-card">
      <span id="statusBadge" class="status-badge"></span>
      <h3 id="resultTitle"></h3>
      <p id="resultDescription"></p>

      <div class="recommendations">
        <h4>Consigli per il tuo budget:</h4>
        <ul id="recommendationsList"></ul>
      </div>
    </div>
  </div>

  <script>
    const recommendationsDB = {
      smartphone: [
        { maxBudget: 150, options: ["Redmi Note 13", "POCO M6"] },
        { maxBudget: 300, options: ["Samsung Galaxy A35", "Nothing Phone (2a)", "Redmi Note 13 Pro"] },
        { maxBudget: 600, options: ["Google Pixel 8a", "Samsung Galaxy S23", "Xiaomi 13T"] },
        { maxBudget: Infinity, options: ["iPhone 15/17", "Samsung Galaxy S24 Ultra", "Google Pixel 11 Pro"] }
      ],
      tablet: [
        { maxBudget: 150, options: ["Redmi Pad SE", "Lenovo Tab M11"] },
        { maxBudget: 350, options: ["Xiaomi Pad 6", "iPad 10ª generazione"] },
        { maxBudget: Infinity, options: ["iPad Air (M2)", "Samsung Galaxy Tab S9"] }
      ],
      speaker: [
        { maxBudget: 50, options: ["JBL GO 3", "Sony SRS-XB100"] },
        { maxBudget: 120, options: ["JBL Flip 6", "Soundcore Motion+"] },
        { maxBudget: Infinity, options: ["Marshall Emberton II", "JBL Charge 5"] }
      ],
      smartwatch: [
        { maxBudget: 60, options: ["Redmi Watch 4", "CMF Watch Pro 2"] },
        { maxBudget: 200, options: ["Galaxy Watch 6", "Amazfit Balance"] },
        { maxBudget: Infinity, options: ["Apple Watch Series 9", "Galaxy Watch 7"] }
      ]
    };

    document.getElementById('techForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const category = document.getElementById('category').value;
      const model = document.getElementById('model').value.trim();
      const year = parseInt(document.getElementById('year').value);
      const budget = parseFloat(document.getElementById('budget').value);

      const currentYear = new Date().getFullYear();
      const age = currentYear - year;

      const resultCard = document.getElementById('resultCard');
      const statusBadge = document.getElementById('statusBadge');
      const resultTitle = document.getElementById('resultTitle');
      const resultDescription = document.getElementById('resultDescription');
      const recommendationsList = document.getElementById('recommendationsList');

      let statusText = '';
      let statusClass = '';
      let title = '';
      let description = '';

      if (age <= 2) {
        statusText = 'È Ancora Buono!';
        statusClass = 'status-keep';
        title = `${model} è molto valido`;
        description = `Ha circa ${age} anni. Riceve probabilmente ancora aggiornamenti ed ha prestazioni adeguate per la maggior parte delle attività. Ti consigliamo di tenerlo ancora ma se lo vuoi rivendere il prezzo potrebbe essere molto alto.`;
      } else if (age <= 4) {
        statusText = 'Valuta uno nuovo';
        statusClass = 'status-upgrade';
        title = `${model} inizia a mostrare i suoi anni`;
        description = `Con ${age} anni di servizio, la batteria o il supporto software potrebbero iniziare a mostrare i limiti. Se noti rallentamenti o spegnimenti improvvisi, può valere la pena cambiarlo ma se gli aggiornamenti vanno ancora potresti ancora tenerlo.`;
      } else {
        statusText = 'Consiglio la sostituzione';
        statusClass = 'status-replace';
        title = `${model} è da sostituire`;
        description = `Un dispositivo di ${age} anni è ormai superato per aggiornamenti di sicurezza, batteria e prestazioni generali. Cambiarlo ti darà un grande salto di qualità.`;
      }

      resultCard.style.display = 'block';
      resultCard.style.backgroundColor = age <= 2 ? 'rgba(34, 197, 94, 0.12)' : (age <= 4 ? 'rgba(234, 179, 8, 0.12)' : 'rgba(239, 68, 68, 0.12)');
      statusBadge.className = `status-badge ${statusClass}`;
      statusBadge.textContent = statusText;
      resultTitle.textContent = title;
      resultDescription.textContent = description;

      recommendationsList.innerHTML = '';
      const catDB = recommendationsDB[category] || recommendationsDB.smartphone;
      const matchedTier = catDB.find(tier => budget <= tier.maxBudget) || catDB[catDB.length - 1];

      matchedTier.options.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `• ${item}`;
        recommendationsList.appendChild(li);
      });
    });
  </script>

</body>
          </html>
