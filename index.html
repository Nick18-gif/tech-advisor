<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="description" content="Tech Advisor - Valuta se conviene aggiornare, riparare o sostituire il tuo dispositivo elettronico.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Advisor</title>
  
  <!-- Importazione font stile Apple (Plus Jakarta Sans & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      /* Font elegante e moderno stile Apple SF Pro */
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body { 
      background: linear-gradient(135deg, #090d16 0%, #111827 30%, #1e1b4b 70%, #312e81 100%);
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
      position: relative;
      overflow-x: hidden;
    }

    /* Elementi liquidi e luminosi sotto il vetro con animazione graduale */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      animation: float 10s ease-in-out infinite alternate;
    }
    body::before {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.7) 0%, rgba(37, 99, 235, 0.2) 100%);
      top: 10%;
      left: 10%;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(236, 72, 153, 0.2) 100%);
      bottom: 5%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Contenitore ad alto effetto Liquid Glass (Glassmorphism Avanzato) */
    .container { 
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(28px) saturate(210%);
      -webkit-backdrop-filter: blur(28px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      padding: 32px; 
      border-radius: 28px; 
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.4),
        inset 0 -2px 4px rgba(0, 0, 0, 0.2); 
      max-width: 550px; 
      width: 100%; 
    }

    h1 { 
      font-size: 2rem; 
      font-weight: 700;
      margin-bottom: 8px; 
      color: #ffffff; 
      text-align: center; 
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: -0.6px;
    }
    
    p.subtitle { 
      font-size: 0.95rem; 
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85); 
      text-align: center; 
      margin-bottom: 24px; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      letter-spacing: -0.2px;
    }

    .form-group { margin-bottom: 18px; }
    
    label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 8px; 
      font-size: 0.88rem; 
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      letter-spacing: -0.1px;
    }

    select, input { 
      width: 100%; 
      padding: 13px 16px; 
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.25); 
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px; 
      font-size: 0.98rem; 
      font-weight: 400;
      color: #ffffff;
      outline: none; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
      letter-spacing: -0.2px;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.65);
      font-weight: 400;
    }

    select option {
      background-color: #0f172a;
      color: #ffffff;
    }

    select:focus, input:focus { 
      border-color: #60a5fa; 
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 16px rgba(96, 165, 250, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    button { 
      width: 100%; 
      padding: 15px; 
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.85) 0%, rgba(37, 99, 235, 0.95) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white; 
      border: 1px solid rgba(255, 255, 255, 0.4); 
      border-radius: 14px; 
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 12px; 
      transition: all 0.3s ease; 
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      letter-spacing: -0.2px;
    }

    button:hover { 
      background: linear-gradient(135deg, rgba(96, 165, 250, 0.9) 0%, rgba(59, 130, 246, 0.95) 100%);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
    }

    .result-card { 
      margin-top: 24px; 
      padding: 22px; 
      border-radius: 18px; 
      display: none; 
      animation: fadeIn 0.4s ease-out; 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(12px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .status-badge { 
      display: inline-block; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-weight: 700; 
      font-size: 0.8rem; 
      margin-bottom: 12px; 
      text-transform: uppercase; 
      letter-spacing: 0.6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .status-keep { background-color: rgba(34, 197, 94, 0.25); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.5); }
    .status-upgrade { background-color: rgba(234, 179, 8, 0.25); color: #fde047; border: 1px solid rgba(253, 224, 71, 0.5); }
    .status-replace { background-color: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.5); }

    .result-card h3 { margin-bottom: 10px; font-size: 1.25rem; font-weight: 600; color: #ffffff; letter-spacing: -0.3px; }
    .result-card p { font-size: 0.93rem; font-weight: 400; line-height: 1.5; color: rgba(255, 255, 255, 0.95); margin-bottom: 12px; }

    .recommendations { 
      margin-top: 14px; 
      background: rgba(0, 0, 0, 0.25); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px; 
      border-radius: 14px; 
      border-left: 4px solid #60a5fa; 
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .recommendations h4 { font-size: 0.92rem; font-weight: 600; margin-bottom: 6px; color: #ffffff; letter-spacing: -0.2px; }
    .recommendations ul { list-style: none; }
    .recommendations li { font-size: 0.88rem; font-weight: 400; padding: 4px 0; color: rgba(255, 255, 255, 0.9); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tech advisor</h1>
    <p class="subtitle">Scopri se è ora di cambiare il tuo dispositivo e cosa comprare con il tuo budget.</p>

    <form id="techForm">
      <div class="form-group">
        <label for="category">Tipo di Dispositivo</label>
        <select id="category" required>
          <option value="" disabled selected>Seleziona una categoria</option>
          <option value="smartphone">Smartphone</option>
          <option value="tablet">Tablet</option>
          <option value="speaker">Cassa Bluetooth / Audio</option>
          <option value="smartwatch">Smartwatch</option>
        </select>
      </div>

      <div class="form-group">
        <label for="model">Modello esatto</label>
        <input type="text" id="model" placeholder="Es. Huawei P30 Lite, Redmi Pad SE, JBL GO 3..." required>
      </div>

      <div class="form-group">
        <label for="year">Anno di acquisto (approssimativo)</label>
        <input type="number" id="year" placeholder="Es. 2019" min="2000" max="2026" required>
      </div>

      <div class="form-group">
        <label for="budget">Il tuo Budget (€)</label>
        <input type="number" id="budget" placeholder="Es. 250" min="10" required>
      </div>

      <button type="submit">Valuta Dispositivo</button>
    </form>

    <div id="resultCard" class="result-card">
      <span id="statusBadge" class="status-badge"></span>
      <h3 id="resultTitle"></h3>
      <p id="resultDescription"></p>

      <div class="recommendations">
        <h4>Consigli per il tuo budget:</h4>
        <ul id="recommendationsList"></ul>
      </div>
    </div>
  </div>

  <script>
    const recommendationsDB = {
      smartphone: [
        { maxBudget: 150, options: ["Redmi Note 13", "POCO M6"] },
        { maxBudget: 300, options: ["Samsung Galaxy A35", "Nothing Phone (2a)", "Redmi Note 13 Pro"] },
        { maxBudget: 600, options: ["Google Pixel 8a", "Samsung Galaxy S23", "Xiaomi 13T"] },
        { maxBudget: Infinity, options: ["iPhone 15/17", "Samsung Galaxy S24 Ultra", "Google Pixel 11 Pro"] }
      ],
      tablet: [
        { maxBudget: 150, options: ["Redmi Pad SE", "Lenovo Tab M11"] },
        { maxBudget: 350, options: ["Xiaomi Pad 6", "iPad 10ª generazione"] },
        { maxBudget: Infinity, options: ["iPad Air (M2)", "Samsung Galaxy Tab S9"] }
      ],
      speaker: [
        { maxBudget: 50, options: ["JBL GO 3", "Sony SRS-XB100"] },
        { maxBudget: 120, options: ["JBL Flip 6", "Soundcore Motion+"] },
        { maxBudget: Infinity, options: ["Marshall Emberton II", "JBL Charge 5"] }
      ],
      smartwatch: [
        { maxBudget: 60, options: ["Redmi Watch 4", "CMF Watch Pro 2"] },
        { maxBudget: 200, options: ["Galaxy Watch 6", "Amazfit Balance"] },
        { maxBudget: Infinity, options: ["Apple Watch Series 9", "Galaxy Watch 7"] }
      ]
    };

    document.getElementById('techForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const category = document.getElementById('category').value;
      const model = document.getElementById('model').value.trim();
      const year = parseInt(document.getElementById('year').value);
      const budget = parseFloat(document.getElementById('budget').value);

      const currentYear = new Date().getFullYear();
      const age = currentYear - year;

      const resultCard = document.getElementById('resultCard');
      const statusBadge = document.getElementById('statusBadge');
      const resultTitle = document.getElementById('resultTitle');
      const resultDescription = document.getElementById('resultDescription');
      const recommendationsList = document.getElementById('recommendationsList');

      let statusText = '';
      let statusClass = '';
      let title = '';
      let description = '';

      if (age <= 2) {
        statusText = 'È Ancora Buono!';
        statusClass = 'status-keep';
        title = `${model} è molto valido`;
        description = `Ha circa ${age} anni. Riceve probabilmente ancora aggiornamenti ed ha prestazioni adeguate per la maggior parte delle attività. Ti consigliamo di tenerlo ancora ma se lo vuoi rivendere il prezzo potrebbe essere molto alto.`;
      } else if (age <= 4) {
        statusText = 'Valuta uno nuovo';
        statusClass = 'status-upgrade';
        title = `${model} inizia a mostrare i suoi anni`;
        description = `Con ${age} anni di servizio, la batteria o il supporto software potrebbero iniziare a mostrare i limiti. Se noti rallentamenti o spegnimenti improvvisi, può valere la pena cambiarlo ma se gli aggiornamenti vanno ancora potresti ancora tenerlo.`;
      } else {
        statusText = 'Consiglio la sostituzione';
        statusClass = 'status-replace';
        title = `${model} è da sostituire`;
        description = `Un dispositivo di ${age} anni è ormai superato per aggiornamenti di sicurezza, batteria e prestazioni generali. Cambiarlo ti darà un grande salto di qualità.`;
      }

      resultCard.style.display = 'block';
      resultCard.style.backgroundColor = age <= 2 ? 'rgba(34, 197, 94, 0.15)' : (age <= 4 ? 'rgba(234, 179, 8, 0.15)' : 'rgba(239, 68, 68, 0.15)');
      statusBadge.className = `status-badge ${statusClass}`;
      statusBadge.textContent = statusText;
      resultTitle.textContent = title;
      resultDescription.textContent = description;

      recommendationsList.innerHTML = '';
      const catDB = recommendationsDB[category] || recommendationsDB.smartphone;
      const matchedTier = catDB.find(tier => budget <= tier.maxBudget) || catDB[catDB.length - 1];

      matchedTier.options.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `• ${item}`;
        recommendationsList.appendChild(li);
      });
    });
  </script>

</body>
</html>
