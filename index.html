<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Advisor</title>
  <meta name="description" content="Tech Advisor - Consigli per il tuo dispositivo">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-dark: #0B0F19;
      --card-bg: rgba(23, 31, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --accent-blue: #3B82F6;
      --accent-purple: #8B5CF6;
      --gradient-accent: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    select.form-control option {
      background-color: #111827;
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gradient-accent);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Card di Risultato ed Errore */
    .card-result, .card-error {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid transparent;
      animation: fadeIn 0.3s ease;
    }

    .card-error {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .status-replace { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .status-upgrade { background: rgba(234, 179, 8, 0.2); color: #eab308; }
    .status-keep { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

    .result-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .info-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .info-body {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .recommendations-list {
      list-style: none;
      margin-top: 8px;
    }

    .recommendations-list li {
      font-size: 0.9rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Tech Advisor</h1>
      <p>Scopri se è ora di cambiare il tuo dispositivo e cosa comprare con il tuo budget.</p>
    </div>

    <form id="techForm">
      <div class="form-group">
        <label for="category">Tipo di Dispositivo</label>
        <select id="category" class="form-control" required>
          <option value="" disabled selected>Seleziona una categoria</option>
          <option value="smartphone">Smartphone</option>
          <option value="tablet">Tablet</option>
          <option value="speaker">Cassa Bluetooth / Audio</option>
          <option value="smartwatch">Smartwatch</option>
        </select>
      </div>

      <div class="form-group">
        <label for="model">Modello esatto</label>
        <input type="text" id="model" class="form-control" placeholder="Es. Redmi Note 13 Pro, iPhone 12, JBL GO 3..." required>
      </div>

      <div class="form-group">
        <label for="year">Anno di acquisto (approssimativo)</label>
        <input type="number" id="year" class="form-control" placeholder="Es. 2021" min="2000" max="2026" required>
      </div>

      <div class="form-group">
        <label for="condition">Condizioni del Dispositivo</label>
        <select id="condition" class="form-control" required>
          <option value="" disabled selected>Seleziona le condizioni attuali</option>
          <option value="excellent">Come nuovo (Nessun graffio, batteria ottima)</option>
          <option value="good">Buono (Lievi segni d'usura, batteria OK)</option>
          <option value="fair">Discreto (Graffi evidenti o batteria usurata)</option>
          <option value="damaged">Danneggiato (Schermo/Vetro rotto o problemi hardware)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budget">Il tuo Budget (€)</label>
        <input type="number" id="budget" class="form-control" placeholder="Es. 250" min="0" required>
      </div>

      <button type="submit" class="btn-submit">Valuta Dispositivo</button>
    </form>

    <div id="errorCard" class="card-error"></div>

    <div id="resultCard" class="card-result">
      <div id="statusBadge" class="status-badge"></div>
      <h2 id="resultTitle" class="result-title"></h2>
      <p id="resultDescription" class="result-desc"></p>

      <div class="info-section">
        <div id="conditionTitle" class="info-title"></div>
        <div id="conditionDescription" class="info-body"></div>
      </div>

      <div class="info-section">
        <div class="info-title">I nostri consigli per il tuo budget:</div>
        <ul id="recommendationsList" class="recommendations-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const extendedBrands = [
      "iphone", "ipad", "macbook", "imac", "samsung", "galaxy", "huawei", "honor", 
      "xiaomi", "redmi", "poco", "realme", "oppo", "vivo", "oneplus", "google", 
      "pixel", "motorola", "moto", "sony", "jbl", "lenovo", "asus", "nokia", 
      "nothing", "cmf", "soundcore", "marshall", "bose", "apple", "watch", 
      "fitbit", "amazfit", "garmin", "lg", "tcl", "zte", "alcatel", "redmagic", 
      "nubia", "rog", "black shark", "meizu", "infinix", "tecno", "iqoo"
    ];

    const recommendationsDB = {
      smartphone: [
        { maxBudget: 150, options: ["Redmi Note 13", "POCO M6"] },
        { maxBudget: 300, options: ["Samsung Galaxy A35", "Nothing Phone (2a)", "Redmi Note 13 Pro"] },
        { maxBudget: 600, options: ["Google Pixel 8a", "Samsung Galaxy S23", "Xiaomi 13T"] },
        { maxBudget: Infinity, options: ["iPhone 15/17", "Samsung Galaxy S24 Ultra", "Google Pixel 9 Pro"] }
      ],
      tablet: [
        { maxBudget: 150, options: ["Redmi Pad SE", "Lenovo Tab M11"] },
        { maxBudget: 350, options: ["Xiaomi Pad 6", "iPad 10ª generazione"] },
        { maxBudget: Infinity, options: ["iPad Air (M2)", "Samsung Galaxy Tab S9"] }
      ],
      speaker: [
        { maxBudget: 50, options: ["JBL GO 3", "Sony SRS-XB100"] },
        { maxBudget: 120, options: ["JBL Flip 6", "Soundcore Motion+"] },
        { maxBudget: Infinity, options: ["Marshall Emberton II", "JBL Charge 5"] }
      ],
      smartwatch: [
        { maxBudget: 60, options: ["Redmi Watch 4", "CMF Watch Pro 2"] },
        { maxBudget: 200, options: ["Galaxy Watch 6", "Amazfit Balance"] },
        { maxBudget: Infinity, options: ["Apple Watch Series 9", "Galaxy Watch 7"] }
      ]
    };

    function getMinReleaseYear(model, category) {
      const m = model.toLowerCase();
      if (m.includes("iphone 17")) return 2025;
      if (m.includes("iphone 16")) return 2024;
      if (m.includes("iphone 15")) return 2023;
      if (m.includes("iphone 14")) return 2022;
      if (m.includes("iphone 13")) return 2021;
      if (m.includes("iphone 12")) return 2020;
      if (m.includes("iphone 11")) return 2019;
      if (m.includes("iphone x") || m.includes("iphone 8")) return 2017;
      if (m.includes("iphone 7")) return 2016;
      if (m.includes("iphone 6")) return 2014;
      if (m.includes("iphone 5")) return 2012;
      if (m.includes("iphone 4")) return 2010;
      if (m.includes("iphone")) return 2007;

      if (m.includes("s24")) return 2024;
      if (m.includes("s23")) return 2023;
      if (m.includes("s22")) return 2022;
      if (m.includes("s21")) return 2021;
      if (m.includes("s20")) return 2020;

      if (m.includes("redmagic 9")) return 2023;
      if (m.includes("redmagic 8")) return 2022;
      if (m.includes("redmagic")) return 2018;

      if (category === "smartphone") return 2007;
      if (category === "smartwatch") return 2013;

      return 2000;
    }

    // Parametri segreti criptati in Base64 (Censura completa nel codice sorgente)
    const _eCat = "c21hcnRwaG9uZQ=="; // smartphone
    const _eMod = "MTggOA==";           // 18 8
    const _eYr = 2017;                  // 2017
    const _eCND = "ZGFtYWdlZA==";       // damaged
    const _eBgt = 1817;                 // 1817
    const _eMsg = "RG9uZSBpcyBiZXR0ZXIgdGhhbiBwZXJmZWN04oCUanVzdCBsaWtlIHRoaXMgc2l0ZS4=";

    document.getElementById('techForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const category = document.getElementById('category').value;
      const model = document.getElementById('model').value.trim();
      const year = parseInt(document.getElementById('year').value);
      const condition = document.getElementById('condition').value;
      const budget = parseFloat(document.getElementById('budget').value);

      const errorCard = document.getElementById('errorCard');
      const resultCard = document.getElementById('resultCard');
      const modelLower = model.toLowerCase();

      // --- 1. VERIFICA EASTER EGG (Invisibile e criptato) ---
      if (category === atob(_eCat) && 
          modelLower === atob(_eMod) && 
          year === _eYr && 
          condition === atob(_eCND) && 
          budget === _eBgt) {
        
        resultCard.style.display = 'none';
        errorCard.textContent = atob(_eMsg);
        errorCard.style.display = 'block';
        errorCard.style.backgroundColor = 'rgba(59, 130, 246, 0.2)';
        errorCard.style.borderColor = 'rgba(59, 130, 246, 0.5)';
        errorCard.style.color = '#60a5fa';
        return; // Interrompe il form mostrando solo l'Easter Egg
      }

      // Ripristino stili standard per gli errori normali
      errorCard.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
      errorCard.style.borderColor = 'rgba(239, 68, 68, 0.3)';
      errorCard.style.color = '#fca5a5';

      // --- 2. CONTROLLO VALIDITÀ MARCA ---
      const isBrandValid = extendedBrands.some(brand => modelLower.includes(brand)) || modelLower.length > 3;

      if (!isBrandValid) {
        resultCard.style.display = 'none';
        errorCard.textContent = "❌ Mi dispiace, ma questo non sembra un dispositivo tecnologico valido!";
        errorCard.style.display = 'block';
        return;
      }

      // --- 3. CONTROLLO ANNO RILASCIO ---
      const minReleaseYear = getMinReleaseYear(model, category);
      if (year < minReleaseYear) {
        resultCard.style.display = 'none';
        errorCard.textContent = `❌ Mi dispiace, ma "${model}" non esisteva ancora nel ${year}!`;
        errorCard.style.display = 'block';
        return;
      }

      // Nasconde eventuali errori precedenti
      errorCard.style.display = 'none';

      // --- 4. CALCOLO VALUTAZIONE E CONSIGLI PER DISPOSITIVI NORMALI ---
      const currentYear = new Date().getFullYear();
      const age = currentYear - year;

      const statusBadge = document.getElementById('statusBadge');
      const resultTitle = document.getElementById('resultTitle');
      const resultDescription = document.getElementById('resultDescription');
      const conditionTitle = document.getElementById('conditionTitle');
      const conditionDescription = document.getElementById('conditionDescription');
      const recommendationsList = document.getElementById('recommendationsList');

      let statusText = '';
      let statusClass = '';
      let title = '';
      let description = '';
      let condDesc = '';

      if (condition === 'damaged' || age > 4) {
        statusText = 'Consiglio la sostituzione';
        statusClass = 'status-replace';
        title = `${model} è da sostituire`;
        description = `Tra anzianità (${age} anni) o danni al dispositivo, le riparazioni non sono convenienti. Ti consigliamo di passare a un nuovo modello.`;
      } else if (condition === 'fair' || age >= 3) {
        statusText = 'Valuta un cambio';
        statusClass = 'status-upgrade';
        title = `${model} inizia a mostrare i suoi anni`;
        description = `Il dispositivo ha circa ${age} anni. Può ancora essere usato per compiti base, ma la batteria o lo stato estetico potrebbero limitarne l'uso.`;
      } else {
        statusText = 'È Ancora Buono!';
        statusClass = 'status-keep';
        title = `${model} è molto valido`;
        description = `Ha circa ${age} anni ed è mantenuto molto bene! Ti consigliamo di tenertelo ancora o rivenderlo a un ottimo prezzo se desideri fare un upgrade.`;
      }

      switch(condition) {
        case 'excellent':
          condDesc = '✨ <b>Stato Perfetto:</b> Puoi ottenere il massimo valore di permuta/usato se decidi di venderlo oggi stesso.';
          break;
        case 'good':
          condDesc = '👍 <b>Buono Stato:</b> Presenta una normale usura del tempo. Funzionamento ottimale senza costi aggiuntivi di riparazione.';
          break;
        case 'fair':
          condDesc = '⚠️ <b>Stato Discreto:</b> La batteria o l\'estetica necessitano attenzione. Valuta se spendere per ripararlo o mettere quei soldi nel nuovo budget.';
          break;
        case 'damaged':
          condDesc = '🛠️ <b>Danneggiato:</b> Il costo del ricambio (schermo/hardware) spesso supera il valore residuo del dispositivo stesso.';
          break;
      }

      resultCard.style.display = 'block';
      resultCard.style.backgroundColor = statusClass === 'status-keep' ? 'rgba(34, 197, 94, 0.15)' : (statusClass === 'status-upgrade' ? 'rgba(234, 179, 8, 0.15)' : 'rgba(239, 68, 68, 0.15)');
      statusBadge.className = `status-badge ${statusClass}`;
      statusBadge.textContent = statusText;
      resultTitle.textContent = title;
      resultDescription.textContent = description;

      conditionTitle.textContent = "Valutazione Condizioni:";
      conditionDescription.innerHTML = condDesc;

      recommendationsList.innerHTML = '';
      const catDB = recommendationsDB[category] || recommendationsDB.smartphone;
      const matchedTier = catDB.find(tier => budget <= tier.maxBudget) || catDB[catDB.length - 1];

      matchedTier.options.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `• ${item}`;
        recommendationsList.appendChild(li);
      });
    });
  </script>
</body>
          </html>
